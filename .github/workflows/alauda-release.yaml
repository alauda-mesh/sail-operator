name: Alauda Release workflow

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
      bundle_channels:
        description: "Bundle channels"
        required: true
        default: stable,stable-2.2
      is_draft_release:
        description: "Draft release"
        type: boolean
        required: false
        default: true
      is_pre_release:
        description: "Pre-release"
        type: boolean
        required: false
        default: false

run-name: Release ${{ inputs.release_version }}

env:
  # 显式 pin 编译用 go 版本，覆盖 runner 本机 go，避免 stdlib 漏洞进入镜像。
  # CVE-2026-33818/39821/46600/56853/56858/56859/56860/56862（stdlib）修于 go1.26.6，
  # 取当前构建线 1.26 的最新 patch，不跨大版本。
  GOTOOLCHAIN: go1.26.6
  GIT_USER: ${{ secrets.GIT_USER }}
  GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
  VERSION: ${{ inputs.release_version }}
  IMAGE_REPOSITORY: build-harbor.alauda.cn/asm/servicemesh-operator2
  TOOLS_REGISTRY_PROVIDER: registry.istio.io
  GENERATE_RELATED_IMAGES: "true"
  VENDOR_LD_EXTRAFLAGS: ${{ vars.LD_EXTRAFLAGS }}

jobs:
  release:
    runs-on: [self-hosted, linux, x64]
    outputs:
      image: ${{ steps.output_image.outputs.image }}
      bundle_image: ${{ steps.output_bundle_image.outputs.image }}

    steps:
      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.3.0

      - name: Login to build-harbor.alauda.cn
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - uses: actions/checkout@v7

      - name: Add operator provenance metadata
        shell: bash
        env:
          OPERATOR_DOCKERFILE: Dockerfile.alauda
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            printf '\n'
            printf 'LABEL org.opencontainers.image.source="%s"\n' "$SOURCE"
            printf 'LABEL org.opencontainers.image.revision="%s"\n' "$SOURCE_REVISION"
            printf 'LABEL org.opencontainers.image.ref.name="%s"\n' "$SOURCE_REF"
          } >> "$OPERATOR_DOCKERFILE"

      - name: Build and push operator image
        run: |
          make alauda-docker-buildx \
            -e TAG=$VERSION

      - name: "Output image: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}"
        id: output_image
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}:${{ env.VERSION }}
        run: |
          echo "BUILD_IMAGE=${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Build image"
            echo
            echo "\`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate bundle metadata
        run: |
          make bundle \
            -e TAG=$VERSION \
            -e CHANNELS=$CHANNELS
        env:
          CHANNELS: ${{ inputs.bundle_channels }}

      - name: Add bundle provenance metadata
        shell: bash
        env:
          BUNDLE_DOCKERFILE: bundle.Dockerfile
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            printf '\n'
            printf 'LABEL org.opencontainers.image.source="%s"\n' "$SOURCE"
            printf 'LABEL org.opencontainers.image.revision="%s"\n' "$SOURCE_REVISION"
            printf 'LABEL org.opencontainers.image.ref.name="%s"\n' "$SOURCE_REF"
          } >> "$BUNDLE_DOCKERFILE"

      - name: Build and push bundle image
        id: build_bundle
        continue-on-error: true
        run: |
          make bundle-build \
            -e VERSION=$VERSION
          make bundle-push

      - name: "Output image: ${{ env.IMAGE_REPOSITORY }}-bundle:v${{ env.VERSION }}"
        id: output_bundle_image
        if: ${{ steps.build_bundle.outcome == 'success' }}
        shell: bash
        env:
          IMAGE: ${{ env.IMAGE_REPOSITORY }}-bundle:v${{ env.VERSION }}
        run: |
          echo "BUILD_IMAGE=${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Build image"
            echo
            echo "\`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set release target branch
        id: release_target
        shell: bash
        run: |
          # release 的 --target 分支由 release_version 前两段推导，与 make 的 MINOR_VERSION 一致。
          TARGET_BRANCH="release-$(echo "$VERSION" | cut -d. -f1-2)"
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: ${{ github.ref_type == 'branch' && github.ref_name == steps.release_target.outputs.target_branch }}
        env:
          TARGET_BRANCH: ${{ steps.release_target.outputs.target_branch }}
          GH_PRE_RELEASE: ${{ github.event.inputs.is_pre_release == 'true' }}
          GH_RELEASE_DRAFT: ${{ github.event.inputs.is_draft_release == 'true' }}
        run: |
          make create-gh-release \
            -e GH_PRE_RELEASE=$GH_PRE_RELEASE \
            -e GH_RELEASE_DRAFT=$GH_RELEASE_DRAFT
          {
            echo "### GitHub release"
            echo
            echo "✅ Created release \`${VERSION}\` (target \`${TARGET_BRANCH}\`, draft: \`${GH_RELEASE_DRAFT}\`)."
          } >> "$GITHUB_STEP_SUMMARY"
